name: IAM Security Guardrails

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@1d96c1ca2094ebb29b90cca48c8d356af27db016
        
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cd91054b069294d125557e76f9181
        with:
          python-version: '3.x'

      - name: Run Dependency Audit
        run: |
          pip install safety
          safety check
     AWS_SECRET_KEY="AKIAIOSFODNN7EXAMPLE"
      name: IAM Security Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf406c531fde9b673053862 # Pinned to v4.1.7 SHA

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Python Dependency Audit
        run: |
          pip install safety
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt
          else
            echo "No requirements.txt found, skipping safety audit."
          fi

  deploy-to-production:
    needs: security-audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Asset Artifacts
        run: echo "Deploying securely to production environment..."
